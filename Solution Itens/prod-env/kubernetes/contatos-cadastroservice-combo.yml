apiVersion: apps/v1
kind: Deployment
metadata:
  name: contatos-cadastroservice-deployment
  labels:
    app: contatos-cadastrodeployment
    env: production
    group: servicos-de-api
    ms: cadastroservice
spec:
  replicas: 1
  selector:
    matchLabels:
      app: contatos-cadastroservice-pod
  template:
    metadata:
      labels:
        app: contatos-cadastroservice-pod
    spec:
      containers:
      - name: contatos-cadastroservice-container
        image: rodrigocezarleao/contatos.inclusaoservice:v2
        ports:
        - containerPort: 8080

---

apiVersion: v1
kind: Service
metadata:
  name: contatos-cadastroservice-svc
  labels:
    app: contatos-cadastroservice
    env: production
    group: servicos-de-api
    ms: cadastroservice
  annotations:
    description: "Este service é usado para o microsserviço de inclusão de contato"
    url: "http://localhost:31081/"
spec:
  selector:
    app: contatos-cadastroservice-pod
  ports:
    - protocol: TCP
      port: 8081         
      targetPort: 8080   
      nodePort: 31081    
  type: NodePort        