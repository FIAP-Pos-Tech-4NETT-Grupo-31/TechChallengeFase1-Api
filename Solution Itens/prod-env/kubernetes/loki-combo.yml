apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-config
data:
  loki-config.yml: |
    auth_enabled: false
    server:
      http_listen_port: 3100
    ingester:
      lifecycler:
        ring:
          kvstore:
            store: inmemory
          replication_factor: 1
      chunk_idle_period: 3m
      chunk_retain_period: 1m
    schema_config:
      configs:
        - from: 2020-10-24
          store: boltdb-shipper
          object_store: filesystem
          schema: v11
          index:
            prefix: index_
            period: 24h
    storage_config:
      boltdb_shipper:
        active_index_directory: /tmp/loki/index
        cache_location: /tmp/loki/cache
      filesystem:
        directory: /tmp/loki/chunks
    limits_config:
      reject_old_samples: true
      reject_old_samples_max_age: 168h
      allow_structured_metadata: false # Desativa Structured Metadata
    compactor:
      working_directory: /tmp/loki/compactor # Define um diretório de trabalho válido
    common:
      path_prefix: /tmp/loki # Define o prefixo de caminho comum




---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: loki
spec:
  replicas: 1
  selector:
    matchLabels:
      app: loki-pod
  template:
    metadata:
      labels:
        app: loki-pod
    spec:
      containers:
        - name: loki
          image: grafana/loki:latest
          args:
            - "-config.file=/etc/loki/loki-config.yml"
          ports:
            - containerPort: 3100
          volumeMounts:
            - name: config
              mountPath: /etc/loki/loki-config.yml
              subPath: loki-config.yml
      volumes:
        - name: config
          configMap:
            name: loki-config

---

apiVersion: v1
kind: Service
metadata:
  name: loki
spec:
  selector:
    app: loki-pod
  ports:
    - protocol: TCP
      port: 3100
      targetPort: 3100
      nodePort: 31100
  type: NodePort
