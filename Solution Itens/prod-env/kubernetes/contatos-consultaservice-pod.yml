apiVersion: v1
kind: Pod
metadata:
  name: contatos-consultaservice-pod
  labels: # Definição de rótulos
    app: contatos-app
    env: production
    group: servicos-de-api
    ms: consultaservice
  annotations: # Definição de anotações
    description: "Este pod é usado para o microsserviço de consulta de contato"
    url: "http://localhost:31082/"
spec:
  containers:
    - name: contatos-consultaservice-container
      image: rodrigocezarleao/contatos.consultaservice:v1
      env:
        - name: SQLSERVER_HOST
          value: "sqlserver"  # Nome do serviço do SQL Server
        - name: SQLSERVER_PORT
          value: "1433"      # Porta do SQL Server
        - name: SQLSERVER_USER
          value: "SA"        # Usuário do SQL Server
        - name: SQLSERVER_PASSWORD
          value: "Grupo#31"  # Senha do SQL Server
        - name: SQLSERVER_DB
          value: "Contatos"    # Nome do banco de dados
      ports:
        - containerPort: 8080 # Porta exposta pelo container