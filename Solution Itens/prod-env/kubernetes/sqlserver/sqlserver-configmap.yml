            [Id]       INT            IDENTITY (1, 1) NOT NULL,
            [Nome]     NVARCHAR (100) NOT NULL,
            [Email]    VARCHAR (200)  NOT NULL,
            [Telefone] NVARCHAR (20)  NOT NULL,
            [DDD]      INT            NOT NULL,
            PRIMARY KEY CLUSTERED ([Id] ASC),
            CONSTRAINT [FK_Contatos_ToRegioes] FOREIGN KEY ([DDD]) REFERENCES [dbo].[REGIOES] ([DDD])
        );

        EXECUTE sp_addextendedproperty @name = N'MS_Description', @value = N'Codigo do contato', @level0type = N'SCHEMA', @level0name = N'dbo', @level1type = N'TABLE', @level1name = N'CONTATOS', @level2type = N'COLUMN', @level2name = N'Id';

