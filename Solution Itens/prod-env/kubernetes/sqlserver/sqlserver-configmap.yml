apiVersion: v1
kind: ConfigMap
metadata:
  name: init-sql-config
data:
  init.sql: |    
    USE master;
    IF NOT EXISTS (SELECT * FROM sys.databases WHERE name = 'Contatos')
    BEGIN
        CREATE DATABASE Contatos;
    END;
    GO


    WHILE NOT EXISTS (SELECT * FROM sys.databases WHERE name = 'Contatos')
    BEGIN
        WAITFOR DELAY '00:00:01'; -- Espera 1 segundo antes de verificar novamente
    END;

    USE Contatos;
    GO

