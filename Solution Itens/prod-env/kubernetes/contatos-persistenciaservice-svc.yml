apiVersion: v1
kind: Service
metadata:
  name: contatos-persistenciaservice-svc
  labels: # Definição de rótulos
    app: contatos-persistenciaservice
    env: production
    group: servicos-de-api
    ms: persistenciaservice
  annotations: # Definição de anotações
    description: "Este service é usado para o microsserviço de persistência de banco"
    url: "http://localhost:31085/"
spec:
  selector:
    app: contatos-persistenciaservice-pod       # NOME DO POD QUE VAI SER SERVIDO
  ports:
    - protocol: TCP
      port: 8085         # Porta interna que o Service expõe dentro do cluster
      targetPort: 8080   # Porta interna do container (a mesma da API)
      nodePort: 31085    # Porta no nó do Kubernetes para acesso externo (fora do cluster)
  type: NodePort        # Tipo de Service para expor a aplicação externamente