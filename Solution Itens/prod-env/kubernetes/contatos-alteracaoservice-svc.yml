apiVersion: v1
kind: Service
metadata:
  name: contatos-alteracaoservice-svc
  labels: # Definição de rótulos
    app: contatos-alteracaoservice
    env: production
    group: servicos-de-api
    ms: alteracaoservice
  annotations: # Definição de anotações
    description: "Este service é usado para o microsserviço de alteração de contato"
    url: "http://localhost:31083/"
spec:
  selector:
    app: contatos-alteracaoservice-pod
  ports:
    - protocol: TCP
      port: 8083         # Porta interna que o Service expõe dentro do cluster
      targetPort: 8080   # Porta interna do container (a mesma da API)
      nodePort: 31083    # Porta no nó do Kubernetes para acesso externo (fora do cluster)
  type: NodePort        # Tipo de Service para expor a aplicação externamente